name: Arkas Trading Bot

on:
  schedule:
    # S'exécute toutes les heures à la minute 0 (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # Limite à 55 minutes pour ne pas dépasser l'heure

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancement du bot
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
        run: python main.py
